services:

  auth-postgres:
    image: postgres:16
    container_name: relay-auth-postgres

    environment:
      POSTGRES_DB: relay_auth
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay

    ports:
    - "5434:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data


  auth-service:
    build:
      context: ./service/auth-service

    container_name: relay-auth-service

    ports:
      - "8000:8000"

    env_file:
      - ./service/auth-service/.env

    depends_on:
      - auth-postgres


  api-gateway:
    build:
      context: ./service/api-gateway

    container_name: relay-api-gateway

    ports:
      - "8001:8000"

    env_file:
      - ./service/api-gateway/.env

    depends_on:
      - auth-service


  workflow-service:
    build:
      context: ./service/workflow-service

    container_name: relay-workflow-service

    ports:
      - "8002:8000"

    env_file:
      - ./service/workflow-service/.env

    depends_on:
      - auth-service
      - workflow-postgres
      - integration-service

  workflow-postgres:
    image: postgres:16
    container_name: relay-workflow-postgres

    environment:
      POSTGRES_DB: relay_workflow
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay

    ports:
      - "5433:5432"

    volumes:
      - workflow_postgres_data:/var/lib/postgresql/data

  integration-service:
    build:
      context: ./service/integration-service
    container_name: relay-integration-service
    ports:
      - "8003:8000"
    env_file:
      - ./service/integration-service/.env

  integration-postgres:
    image: postgres:16
    container_name: relay-integration-postgres
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay_integration
    ports:
      - "5435:5432"
    volumes:
      - integration_postgres_data:/var/lib/postgresql/data

  action-service:
    build:
      context: ./service/action-service

    container_name: relay-action-service

    ports:
      - "8004:8000"

  action-postgres:
    image: postgres:16
    container_name: relay-action-postgres

    environment:
      POSTGRES_DB: relay_action
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay

    ports:
      - "5436:5432"

    volumes:
      - action_postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: relay-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data


volumes:
  auth_postgres_data:
  workflow_postgres_data:
  integration_postgres_data:
  action_postgres_data:
  kafka_data:
