apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-cluster-infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: relay
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: relay
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: relay
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
