apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: relay
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: relay
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 640Mi
        volumeMounts:
        - name: data
          mountPath: /data
        args:
        - redis-server
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --save
        - ''
        - --maxmemory
        - 192mb
        - --maxmemory-policy
        - noeviction
        - --auto-aof-rewrite-percentage
        - '100'
        - --auto-aof-rewrite-min-size
        - 64mb
        - --bind
        - 0.0.0.0
        - --protected-mode
        - 'no'
        readinessProbe:
          exec: &id001
            command:
            - redis-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
