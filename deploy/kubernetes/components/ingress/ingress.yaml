apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  labels:
    app.kubernetes.io/part-of: relay
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - relay.example.com
    secretName: relay-tls
  rules:
  - host: relay.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              name: http
