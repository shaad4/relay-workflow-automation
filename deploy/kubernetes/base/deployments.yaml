apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-celery-worker
  labels:
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: integration-celery-worker
      app.kubernetes.io/part-of: relay
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: relay-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
      - name: integration-celery-worker
        image: relay/integration-service:dev
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: relay-config
        - secretRef:
            name: relay-integration-service
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - celery
        - -A
        - app.celery_app:celery_app
        - worker
        - --loglevel=warning
        - --queues=integration
        - --concurrency=$(CELERY_WORKER_CONCURRENCY)
        - --hostname=relay@%h
        - --pidfile=/tmp/celery-worker.pid
        env:
        - name: CELERY_WORKER
          value: 'true'
        readinessProbe:
          exec: &id002
            command:
            - python
            - -c
            - import socket; from app.celery_app import celery_app; replies=celery_app.control.ping(destination=['relay@'+socket.gethostname()],
              timeout=5); raise SystemExit(0 if replies else 1)
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 3
        startupProbe:
          exec: *id002
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 20
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-celery-beat
  labels:
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: integration-celery-beat
      app.kubernetes.io/part-of: relay
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: relay-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: integration-celery-beat
        image: relay/integration-service:dev
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: relay-config
        - secretRef:
            name: relay-integration-service
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - celery
        - -A
        - app.celery_app:celery_app
        - beat
        - --loglevel=warning
        - --schedule=/tmp/integration-celerybeat-schedule
        - --pidfile=/tmp/celerybeat.pid
        readinessProbe:
          exec: &id002
            command:
            - python
            - -c
            - import os; from pathlib import Path; os.kill(int(Path('/tmp/celerybeat.pid').read_text().strip()),
              0)
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec: *id002
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
