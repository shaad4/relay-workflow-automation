apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: relay
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: relay-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: api-gateway
        image: relay/api-gateway:dev
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: relay-config
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: relay-jwt
              key: JWT_SECRET_KEY
        ports:
        - name: http
          containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
