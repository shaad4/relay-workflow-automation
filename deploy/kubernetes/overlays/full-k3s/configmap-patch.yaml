apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-config
data:
  RELAY_ENV: production
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  COOKIE_SECURE: 'true'
  FRONTEND_URL: https://relay.example.com
  BACKEND_URL: https://relay.example.com/api/relay
  GOOGLE_REDIRECT_URI: https://relay.example.com/api/relay/auth/google/callback
  GOOGLE_GMAIL_REDIRECT_URI: https://relay.example.com/api/relay/connections/gmail/oauth/callback
