apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- path: configmap-patch.yaml
images:
- name: relay/api-gateway
  newName: relay/api-gateway
  newTag: REPLACE_WITH_RELEASE_TAG
- name: relay/auth-service
  newName: relay/auth-service
  newTag: REPLACE_WITH_RELEASE_TAG
- name: relay/workflow-service
  newName: relay/workflow-service
  newTag: REPLACE_WITH_RELEASE_TAG
- name: relay/integration-service
  newName: relay/integration-service
  newTag: REPLACE_WITH_RELEASE_TAG
- name: relay/action-service
  newName: relay/action-service
  newTag: REPLACE_WITH_RELEASE_TAG
- name: relay/execution-service
  newName: relay/execution-service
  newTag: REPLACE_WITH_RELEASE_TAG
- name: relay/rag-service
  newName: relay/rag-service
  newTag: REPLACE_WITH_RELEASE_TAG
- name: relay/frontend
  newName: relay/frontend
  newTag: REPLACE_WITH_RELEASE_TAG
namespace: relay
