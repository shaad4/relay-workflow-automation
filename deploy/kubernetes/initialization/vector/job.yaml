apiVersion: batch/v1
kind: Job
metadata:
  name: rag-vector-init
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-vector-init
        app.kubernetes.io/part-of: relay
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: initialize
        image: pgvector/pgvector:pg16
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        - PGPASSWORD="$POSTGRES_PASSWORD" psql -h rag-postgres -U "$POSTGRES_USER"
          -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS
          vector;"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        envFrom:
        - secretRef:
            name: rag-postgres
