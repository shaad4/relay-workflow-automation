apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrate
  labels:
    app.kubernetes.io/part-of: relay
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service-migrate
        app.kubernetes.io/part-of: relay
    spec:
      restartPolicy: Never
      serviceAccountName: relay-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: relay/auth-service:dev
        imagePullPolicy: IfNotPresent
        command:
        - alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: relay-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: relay-auth-service
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
