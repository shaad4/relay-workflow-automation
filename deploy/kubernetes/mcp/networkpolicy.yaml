
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-mcp-network
  namespace: relay
spec:
  podSelector:
    matchLabels:
      app: relay-mcp

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8001

  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Relay public HTTPS API
    - ports:
        - protocol: TCP
          port: 443
