# Opt-in production override; requires Compose >=2.24.4. Never contains credentials.
# Run only after backups, explicit migrations, HTTPS and environment review.
services:
  auth-postgres:
    networks: !override [backend]
    ports: !reset []
    mem_limit: ${DATABASE_MEMORY_LIMIT:-512m}
    cpus: ${DATABASE_CPU_LIMIT:-1.0}
  auth-service:
    image: ${RELAY_IMAGE_REGISTRY:?set_release_image_registry}/auth-service:${RELAY_IMAGE_TAG:?set_immutable_release_tag}
    env_file: !override
    - path: ${RELAY_ENV_DIR:?set_absolute_production_env_directory}/auth-service.env
      required: true
    environment:
      RELAY_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?set_https_frontend_url}
      BACKEND_URL: ${BACKEND_URL:?set_https_public_api_url}
      COOKIE_SECURE: 'true'
    ports: !reset []
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    pids_limit: 128
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api-gateway:
    image: ${RELAY_IMAGE_REGISTRY:?set_release_image_registry}/api-gateway:${RELAY_IMAGE_TAG:?set_immutable_release_tag}
    env_file: !override
    - path: ${RELAY_ENV_DIR:?set_absolute_production_env_directory}/api-gateway.env
      required: true
    environment:
      RELAY_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?set_https_frontend_url}
      BACKEND_URL: ${BACKEND_URL:?set_https_public_api_url}
    ports: !override
    - 127.0.0.1:${API_GATEWAY_PORT:-8001}:8000
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    pids_limit: 128
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
