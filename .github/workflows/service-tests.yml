name: Service tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - service/api-gateway
          - service/auth-service
          - service/workflow-service
          - service/integration-service
          - service/action-service
          - service/execution-service
          - service/rag-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/ci_test
      JWT_SECRET_KEY: ci-test-secret-key-that-is-long-enough-for-hs256
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://localhost:8000
      OPENAI_API_KEY: ci-synthetic-key-no-network-calls
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 pytest-cov==7.1.0 httpx==0.28.1

      - name: Run tests with coverage
        run: |
          set +e
          python -m coverage run --source=app --omit='*/grpc/generated/*' -m pytest tests
          test_status=$?
          if [ "${{ matrix.service }}" = "service/rag-service" ]; then
            python -m coverage report --show-missing
          else
            python -m coverage report --show-missing --fail-under=80
          fi
          coverage_status=$?
          python -m coverage xml -o coverage.xml
          xml_status=$?
          if [ "$test_status" -ne 0 ] || [ "$coverage_status" -ne 0 ] || [ "$xml_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore
