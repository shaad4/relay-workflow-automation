name: Service tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 1. BACKEND UNIT TESTS AND COVERAGE
  tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - service/api-gateway
          - service/auth-service
          - service/workflow-service
          - service/integration-service
          - service/action-service
          - service/execution-service
          - service/rag-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/ci_test
      JWT_SECRET_KEY: ci-test-secret-key-that-is-long-enough-for-hs256
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://localhost:8000
      OPENAI_API_KEY: ci-synthetic-key-no-network-calls

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r ../../requirements-test.txt

      - name: Create execution test schema
        if: matrix.service == 'service/execution-service'
        run: python -m alembic upgrade head

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov \
            --cov-fail-under=80 \
            --junitxml=test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: |
            ${{ matrix.service }}/coverage.xml
            ${{ matrix.service }}/coverage.json
            ${{ matrix.service }}/htmlcov
            ${{ matrix.service }}/test-results.xml
          if-no-files-found: warn

  # 2. FRONTEND UNIT TESTS
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  # 3. BACKEND QUALITY - RUFF
  backend-quality:
    name: Backend lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.2

      - name: Check Python lint
        run: ruff check service --output-format=github

      - name: Check Python formatting
        run: ruff format --check service

  # 4. FRONTEND QUALITY AND SECURITY
  frontend-quality:
    name: Frontend quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Build production frontend
        run: npm run build

      - name: Exercise production standalone server
        run: npm run test:standalone

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  # 5. BACKEND SECURITY - BANDIT AND PIP-AUDIT
  backend-security:
    name: Security - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - service/api-gateway
          - service/auth-service
          - service/workflow-service
          - service/integration-service
          - service/action-service
          - service/execution-service
          - service/rag-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          python -m bandit \
            -r "${{ matrix.service }}/app" \
            -x "${{ matrix.service }}/app/grpc/generated" \
            -ll -ii -q

      - name: Audit Python dependencies
        run: |
          python -m pip_audit \
            -r "${{ matrix.service }}/requirements.txt" \
            --progress-spinner off

  # 6. DEPLOYMENT CONTRACTS (no cluster, real credentials or live host access)
  deployment-validation:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manifest validation dependencies
        run: python -m pip install PyYAML==6.0.3
      - name: Render Kustomize overlays and migration Jobs
        run: |
          for overlay in development production bootstrap; do
            kubectl kustomize "deploy/kubernetes/overlays/$overlay" > "/tmp/relay-$overlay.yaml"
          done
          kubectl kustomize deploy/kubernetes/migrations > /tmp/relay-migrations.yaml
      - name: Validate deployment source and rendered invariants
        run: |
          python scripts/check_deployment.py \
            --kubernetes /tmp/relay-development.yaml \
            --kubernetes /tmp/relay-production.yaml \
            --kubernetes /tmp/relay-bootstrap.yaml \
            --kubernetes /tmp/relay-migrations.yaml
      - name: Validate Compose with synthetic configuration
        run: bash scripts/ci-compose-check.sh
      - name: Validate Kubernetes schemas offline
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary /tmp/relay-*.yaml

  # 7. IDENTICAL APPLICATION IMAGES FOR COMPOSE AND KUBERNETES
  container-builds:
    name: Container - ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: api-gateway
            context: service/api-gateway
          - image: auth-service
            context: service/auth-service
          - image: workflow-service
            context: service/workflow-service
          - image: integration-service
            context: service/integration-service
          - image: action-service
            context: service/action-service
          - image: execution-service
            context: service/execution-service
          - image: rag-service
            context: service/rag-service
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build native image (never publish)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: relay/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
      - name: Verify non-root runtime and entrypoint dependencies
        env:
          IMAGE: relay/${{ matrix.image }}:ci
          SERVICE: ${{ matrix.image }}
        run: |
          if [ "$SERVICE" = frontend ]; then
            docker run --rm --entrypoint node "$IMAGE" -e \
              "if(process.getuid()===0)process.exit(1); require('next'); require('fs').accessSync('/app/server.js')"
            docker run --rm --entrypoint sh "$IMAGE" -c '! command -v npm && ! command -v yarn'
          else
            docker run --rm --entrypoint python "$IMAGE" -c \
              'import os, uvicorn; assert os.getuid() != 0'
          fi
      - name: Scan native image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: relay/${{ matrix.image }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln
      - name: Validate ARM64 image build (never publish)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-arm64
