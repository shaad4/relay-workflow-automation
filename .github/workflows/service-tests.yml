name: Service tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - service/api-gateway
          - service/auth-service
          - service/workflow-service
          - service/integration-service
          - service/action-service
          - service/execution-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/ci_test
      JWT_SECRET_KEY: ci-test-secret-key-that-is-long-enough-for-hs256
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://localhost:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: pytest==9.1.1 pytest-cov==7.1.0 httpx==0.28.1

      - name: Run tests with coverage
        run: |
          if [ "${{ matrix.service }}" = "service/execution-service" ]; then
            python -m coverage run --source=app --omit='*/grpc/generated/*' -m pytest
            python -m coverage report --show-missing --fail-under=80
          elif [ "${{ matrix.service }}" = "service/integration-service" ] || [ "${{ matrix.service }}" = "service/workflow-service" ] || [ "${{ matrix.service }}" = "service/action-service" ]; then
            python -m coverage run --source=app --omit='*/grpc/generated/*' -m pytest
            python -m coverage report --show-missing --fail-under=80
          else
            python -m pytest --cov=app --cov-report=term-missing
          fi
