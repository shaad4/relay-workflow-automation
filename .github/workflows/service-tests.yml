name: Service tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - service/api-gateway
          - service/auth-service
          - service/workflow-service
          - service/integration-service
          - service/action-service
          - service/execution-service
          - service/rag-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/ci_test
      JWT_SECRET_KEY: ci-test-secret-key-that-is-long-enough-for-hs256
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://localhost:8000
      OPENAI_API_KEY: ci-synthetic-key-no-network-calls
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r ../../requirements-test.txt

      - name: Create execution test schema
        if: matrix.service == 'service/execution-service'
        run: python -m alembic upgrade head

      - name: Run tests with coverage
        run: |
          set +e
          python -m pytest tests --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-report=html:htmlcov --cov-fail-under=80 --junitxml=test-results.xml
          test_status=$?
          exit "$test_status"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: |
            ${{ matrix.service }}/coverage.xml
            ${{ matrix.service }}/coverage.json
            ${{ matrix.service }}/htmlcov
            ${{ matrix.service }}/test-results.xml
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
