name: Relay CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-images:
    name: Publish ${{ matrix.image }} to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: api-gateway
            context: service/api-gateway
          - image: auth-service
            context: service/auth-service
          - image: workflow-service
            context: service/workflow-service
          - image: integration-service
            context: service/integration-service
          - image: action-service
            context: service/action-service
          - image: execution-service
            context: service/execution-service
          - image: rag-service
            context: service/rag-service
          - image: frontend
            context: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shaad4/relay-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
